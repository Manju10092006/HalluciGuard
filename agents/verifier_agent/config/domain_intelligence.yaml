version: "2026.07.27"
default_domain: general
shared_models:
  embedding_model: BAAI/bge-m3
  dense_model: BAAI/bge-m3
  sparse_model: bm25
  cross_encoder: BAAI/bge-reranker-large
  reranker: BAAI/bge-reranker-large
  nli_model: cross-encoder/nli-deberta-v3-base
  sentence_transformer: BAAI/bge-m3
  entity_recognition_model: dslim/bert-base-NER
  classification_model: FacebookAI/roberta-large-mnli
defaults:
  retriever: hybrid_rrf
  retrieval_strategy: multi_source_api_then_bm25_dense_faiss_rrf
  evidence_ranking_strategy: source_credibility_recency_dense_sparse_cross_encoder_nli
  confidence_strategy: credibility_weighted_nli_with_domain_risk_and_source_agreement
  verification_workflow:
    - validate_domain
    - decompose_claim
    - expand_query
    - retrieve_authoritative_sources
    - aggregate_and_deduplicate
    - hybrid_retrieve
    - rerank
    - classify_entailment
    - score_and_explain
  chunking_strategy: source_native_abstract_or_512_token_windows_80_overlap
domains:
  general:
    aliases: [general_knowledge, common]
    adapter: general
    sentence_transformer: intfloat/e5-large-v2
    api_sources:
      - {id: wikidata, name: Wikidata Query Service, base_url: "https://query.wikidata.org/sparql", requires_key: false, credibility: 0.84}
      - {id: wikipedia_rest, name: Wikipedia REST Search, base_url: "https://en.wikipedia.org/w/rest.php/v1/search/page", requires_key: false, credibility: 0.78}
    knowledge_bases: [Wikidata, Wikipedia secondary context]
    benchmarks: [fever]
    notebooks: [research/general/general_verification.ipynb]
  healthcare:
    aliases: [health, clinical]
    adapter: healthcare
    embedding_model: microsoft/BiomedNLP-BiomedBERT-base-uncased-abstract-fulltext
    dense_model: microsoft/BiomedNLP-BiomedBERT-base-uncased-abstract-fulltext
    entity_recognition_model: d4data/biomedical-ner-all
    classification_model: emilyalsentzer/Bio_ClinicalBERT
    api_sources:
      - {id: pubmed, name: PubMed E-Utilities, base_url: "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/", requires_key: false, credibility: 0.97}
      - {id: pubmed_central, name: PubMed Central, base_url: "https://pmc.ncbi.nlm.nih.gov/api/oai/v1/mh/", requires_key: false, credibility: 0.97}
      - {id: clinicaltrials, name: ClinicalTrials.gov, base_url: "https://clinicaltrials.gov/api/v2/studies", requires_key: false, credibility: 0.95}
      - {id: openfda, name: openFDA Drug Label, base_url: "https://api.fda.gov/drug/label.json", requires_key: false, credibility: 0.96}
    knowledge_bases: [PubMed, PMC Open Access, FDA labels, ClinicalTrials.gov]
    benchmarks: [pubhealth, healthver]
    notebooks: [research/healthcare/pubmedbert_demo.ipynb, research/healthcare/biobert_demo.ipynb]
  medicine:
    aliases: [medical]
    adapter: healthcare
    embedding_model: dmis-lab/biobert-base-cased-v1.1
    dense_model: microsoft/BiomedNLP-BiomedBERT-base-uncased-abstract-fulltext
    entity_recognition_model: d4data/biomedical-ner-all
    classification_model: emilyalsentzer/Bio_ClinicalBERT
    api_sources:
      - {id: pubmed, name: PubMed E-Utilities, base_url: "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/", requires_key: false, credibility: 0.97}
