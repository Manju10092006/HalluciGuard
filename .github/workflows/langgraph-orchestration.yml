name: LangGraph Orchestration Tests

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  graph-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install orchestration dependencies
        run: pip install -r orchestration/requirements.txt pytest
      - name: Compile orchestration modules
        run: python -m compileall -q orchestration
      - name: Run graph contract tests
        run: pytest orchestration/tests/test_graph_contract.py -q
