name: Detector and backend regression tests
on:
  push:
    paths: ['halluciguard_detector/**', 'orchestration/**', 'services/**', 'agents/**', 'requirements.txt', 'pytest.ini', '.github/workflows/detector-verifier-integration-tests.yml']
  pull_request:
    paths: ['halluciguard_detector/**', 'orchestration/**', 'services/**', 'agents/**', 'requirements.txt', 'pytest.ini', '.github/workflows/detector-verifier-integration-tests.yml']
permissions:
  contents: read
jobs:
  regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HALLUCIGUARD_ENV: test
      ALLOW_MODEL_DOWNLOADS: 'false'
      N8N_RETRIEVAL_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - run: python -m compileall -q orchestration services agents halluciguard_detector halluciguard_judge
      - run: python -m pytest -q
