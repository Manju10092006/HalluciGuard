name: Detector-Verifier Integration Tests

on:
  push:
    paths:
      - 'agents/detector_agent/**'
      - '.github/workflows/detector-verifier-integration-tests.yml'
  pull_request:
    paths:
      - 'agents/detector_agent/**'
      - '.github/workflows/detector-verifier-integration-tests.yml'

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Detector dependencies
        run: python -m pip install -r agents/detector_agent/requirements.txt pytest

      - name: Run Detector-Verifier contract tests
        env:
          VERIFIER_AGENT_URL: http://127.0.0.1:8001
        run: python -m pytest agents/detector_agent/tests/test_detector_verifier_integration.py -v
