name: Verifier Agent Tests

on:
  push:
    branches: [main]
    paths:
      - "agents/verifier_agent/**"
      - ".github/workflows/verifier-agent-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "agents/verifier_agent/**"
      - ".github/workflows/verifier-agent-tests.yml"

permissions:
  contents: read

jobs:
  verifier-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents/verifier_agent

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agents/verifier_agent/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run verifier unit tests
        run: pytest -q tests
