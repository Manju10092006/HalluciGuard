name: Frontend production checks
on:
  push:
    paths: ['frontend-v2/**', 'vercel.json', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['frontend-v2/**', 'vercel.json', '.github/workflows/frontend.yml']
permissions:
  contents: read
jobs:
  production-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-v2/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm test
      - run: npm run build
