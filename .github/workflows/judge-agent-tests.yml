name: Judge Agent Tests

on:
  push:
    branches: [main]
    paths:
      - "agents/judge_agent/**"
      - ".github/workflows/judge-agent-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "agents/judge_agent/**"
      - ".github/workflows/judge-agent-tests.yml"

permissions:
  contents: read

jobs:
  judge-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test runner
        run: python -m pip install pytest pydantic

      - name: Run Judge-Verifier contract tests
        env:
          PYTHONPATH: agents/judge_agent
        run: pytest -q agents/judge_agent/tests/test_verifier_contract.py
