name: Frontend v2

on:
  push:
    paths:
      - "frontend-v2/**"
      - "package.json"
      - "vercel.json"
      - ".github/workflows/frontend-v2.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend-v2/**"
      - "package.json"
      - "vercel.json"
      - ".github/workflows/frontend-v2.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-v2/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
