gates:
  G1:
    description: "Best model beats BOTH shortcut baselines (M0a, M0b) by >= 0.05 AUROC on P0-test and P4-test"
    target_auroc_margin: 0.05
    actual_margin_m0a: 0.5121
    actual_margin_m0b: 0.0000
    status: "FAIL"
  G2:
    description: "Best model beats OLD detector by >= 0.05 AUROC on P0-test and P4-test"
    target_auroc_margin: 0.05
    actual_margin_old: 0.0000
    status: "FAIL"
  G3:
    description: "ECE <= 0.10 on P4-test after calibration"
    target_ece: 0.10
    actual_p4_ece: 0.3683
    status: "FAIL"
  G4:
    description: "LOW-band miss rate <= 10% AND LOW coverage >= 20% on P4-test"
    target_miss_rate: 0.10
    target_coverage: 0.20
    actual_miss_rate: 0.00
    actual_coverage: 0.35
    status: "PROVISIONAL_PASS"
  G5:
    description: "Contract and failure test suite 100% passing"
    total_tests: 18
    passed_tests: 18
    status: "PASS"
  G6:
    description: "Latency p95 <= 3s for 10 claims"
    target_p95_s: 3.0
    actual_p95_ms: 0.44
    status: "PASS"
  G7:
    description: "Shadow mode >= 200 real requests, zero crashes"
    target_requests: 200
    logged_requests: 0
    status: "NOT_RUN"
